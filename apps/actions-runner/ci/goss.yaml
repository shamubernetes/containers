# yaml-language-server: $schema=https://github.com/goss-org/goss/raw/master/docs/schema.yaml
command:
  zsh --version:
    exit-status: 0
  make --version:
    exit-status: 0
  g++ --version:
    exit-status: 0
  python3 --version:
    exit-status: 0
  ruby-json:
    exec: ruby -rjson -e 'puts JSON.generate("ok" => true)'
    exit-status: 0
    stdout: ['{"ok":true}']
  docker compose version:
    exit-status: 0
  docker buildx version:
    exit-status: 0
  node24-toolcache:
    exec: /opt/hostedtoolcache/node/24.21.0/x64/bin/node --version
    exit-status: 0
    stdout: [v24.21.0]
  node22-toolcache:
    exec: /opt/hostedtoolcache/node/22.23.3/x64/bin/node --version
    exit-status: 0
    stdout: [v22.23.3]
  python-toolcache:
    exec: /opt/hostedtoolcache/Python/3.13.15/x64/bin/python3 --version
    exit-status: 0
    stdout: [Python 3.13.15]
  ruby-toolcache:
    exec: /opt/hostedtoolcache/Ruby/3.3.12/x64/bin/ruby --version
    exit-status: 0
    stdout: [ruby 3.3.12]
file:
  /home/runner/run.sh:
    exists: true
  /opt/hostedtoolcache/node/24.21.0/x64.complete:
    exists: true
  /opt/hostedtoolcache/node/22.23.3/x64.complete:
    exists: true
  /opt/hostedtoolcache/Python/3.13.15/x64.complete:
    exists: true
  /opt/hostedtoolcache/Ruby/3.3.12/x64.complete:
    exists: true
